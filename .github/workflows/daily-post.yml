name: Daily System Design Post

on:
  schedule:
    # 3:30 AM UTC = 9:00 AM IST, every day
    - cron: '30 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run daily generator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
        run: python scripts/generator.py

      - name: Commit and push new content
        run: |
          git config user.name "SystemDesign Bot"
          git config user.email "actions@github.com"

          git add topics/ README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          COMMIT_MSG="docs: add daily system design guide ($(date -u '+%Y-%m-%d'))"
          git commit -m "$COMMIT_MSG"
          git push origin HEAD:main
